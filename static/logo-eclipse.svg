<svg width="320" height="96" viewBox="0 0 320 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Demo Company logo</title>
  <desc id="desc">Modern and clean logo with a blue portal icon and readable company wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="10" y1="8" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F58"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ring" x1="21" y1="18" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DCE8FF" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1F58" flood-opacity="0.18"/>
    </filter>
  </defs>

