    <path d="M33.5 43.5C33.5 37.7 38.2 33 44 33H51C53.2 33 55 34.8 55 37V39.8C55 42 53.2 43.8 51 43.8H44C41.2 43.8 39 46 39 48.8V49.8C39 52.6 41.2 54.8 44 54.8H51C53.2 54.8 55 56.6 55 58.8V61.5C55 63.7 53.2 65.5 51 65.5H44C38.2 65.5 33.5 60.8 33.5 55V43.5Z" fill="white" fill-opacity="0.98"/>
    <path d="M46 31C56.5 31 63.5 38 63.5 48.5C63.5 59 56.5 66 46 66" stroke="#A8C2FF" stroke-width="3" stroke-linecap="round"/>
  </g>

