<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Profile - Demo Company Official</title>
    
    <link rel="icon" type="image/png" href="{{ BRAND_LOGO_URL }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --corp-blue:        #001C54; 
            --corp-blue-light:  #2A56C6; 
            --text-main:        #1e293b;
            --text-muted:       #64748b;
        }

        body { 
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(-45deg, #f8fafc, #f1f5f9, #e2e8f0, #f8fafc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 2rem;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .bg-pattern {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px; opacity: 0.6;
        }

        .floating-nav {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.08); 
            border-radius: 50px;
        }

        .bento-card { 
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
            border-radius: 24px; box-shadow: 0 15px 40px -10px rgba(0,28,84,0.08); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
        }

        .profile-img-container {
            width: 120px; height: 120px; border-radius: 50%; border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 28, 84, 0.12); position: relative; margin: 0 auto;
            cursor: pointer; overflow: hidden; background-color: #f1f5f9;
            display: flex; justify-content: center; align-items: center;
        }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .profile-img-overlay {
            position: absolute; inset: 0; background: rgba(0, 28, 84, 0.5);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; opacity: 0; transition: opacity 0.2s;
        }
        .profile-img-container:hover .profile-img-overlay { opacity: 1; }

        .custom-input, .custom-select {
            width: 100%; padding: 0.75rem 1rem; background-color: #f8fafc;
            border: 1px solid #e2e8f0; border-radius: 12px; color: var(--text-main);
            transition: all 0.2s; font-family: 'Sarabun', sans-serif; font-size: 0.95rem;
        }
        .custom-input:focus, .custom-select:focus {
            outline: none; border-color: var(--corp-blue-light); background-color: white;
            box-shadow: 0 0 0 3px rgba(42, 86, 198, 0.1);
        }
        .custom-input:disabled { background-color: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        
        .dynamic-row { animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .loader { width: 24px; height: 24px; border: 3px solid #e2e8f0; border-top-color: white; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="py-4 md:py-8 px-3 md:px-6 lg:px-8 relative">

    <div class="bg-pattern"></div>

    <!-- Navbar -->
    <nav class="relative z-50 mx-auto w-full max-w-4xl floating-nav px-4 py-2.5 md:px-6 md:py-3 flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="flex items-center justify-center bg-white rounded-full p-2 shadow-sm border border-slate-100 hover:bg-slate-50 transition-colors text-slate-600 hover:text-[var(--corp-blue)]" title="กลับหน้าหลัก">
                <i class="ph-bold ph-caret-left text-xl"></i>
            </a>
            <div class="h-6 w-px bg-slate-200"></div>
            <!-- โลโก้บริษัท -->
            <img src="{{ BRAND_LOGO_URL }}" alt="Demo Company Logo" class="h-6 md:h-8 object-contain">
            <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
            <div class="font-extrabold text-[var(--corp-blue)] text-sm md:text-base hidden sm:block">แก้ไขโปรไฟล์ส่วนตัว</div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto bento-card p-6 md:p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-r from-[var(--corp-blue)] to-[var(--corp-blue-light)] z-0 rounded-t-[24px]"></div>
        
        <form id="profile-form" class="relative z-10 pt-10" onsubmit="saveProfile(event)">
            
            <!-- ส่วนรูปภาพโปรไฟล์ -->
            <div class="text-center mb-8">
                <div class="profile-img-container" onclick="document.getElementById('profile_pic').click()">
                    <!-- ใช้รูปคนเป็นค่าเริ่มต้นแทนรูปโลก -->
                    <img id="preview-img" src="" style="display:none;">
                    <i class="ph-fill ph-user text-5xl text-slate-400" id="fallback-icon"></i>
                    
                    <div class="profile-img-overlay">
                        <i class="ph-bold ph-camera text-2xl mb-1"></i>
                        <span class="text-[10px] font-bold uppercase tracking-wider">เปลี่ยนรูป</span>
                    </div>
                </div>
                <input type="file" id="profile_pic" name="profile_pic" accept="image/png, image/jpeg, image/jpg" class="hidden" onchange="previewImage(event)">
                <div class="mt-3">
                    <h2 class="text-xl font-black text-slate-800" id="display-name">Loading...</h2>
                    <div class="text-sm font-bold text-[var(--corp-blue-light)] mt-0.5" id="display-username">@username</div>
                </div>
            </div>

            <!-- ส่วนแก้ไขข้อมูลพื้นฐาน -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8 pb-8 border-b border-slate-100">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">ชื่อผู้ใช้งาน (Username) <span class="text-red-400">*เปลี่ยนไม่ได้</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="ph-fill ph-identification-badge text-lg"></i></div>
                        <input type="text" id="username" class="custom-input pl-10" disabled>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">ชื่อ-นามสกุล (Full Name) <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="ph-fill ph-user text-lg"></i></div>
                        <input type="text" id="full_name" name="full_name" class="custom-input pl-10" placeholder="ระบุชื่อ-นามสกุล" required>
                    </div>
                </div>
            </div>

            <!-- ส่วนจัดการอีเมลแบบไดนามิก -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-3">
                    <label class="block text-sm font-extrabold text-[var(--corp-blue)] uppercase tracking-wider ml-1">
                        <i class="ph-fill ph-envelope-simple mr-1"></i> ช่องทางการติดต่อ (Email)
                    </label>
                    <button type="button" onclick="addEmailRow()" class="text-xs font-bold text-[var(--corp-blue-light)] hover:text-[var(--corp-blue)] bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                        <i class="ph-bold ph-plus"></i> เพิ่มอีเมล
                    </button>
                </div>
                
                <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-3 mb-4 flex items-center gap-2 shadow-inner">
                    <i class="ph-fill ph-info text-blue-500 text-lg shrink-0"></i>
                    <p class="text-xs text-blue-800 font-medium leading-relaxed">
                        <strong class="text-blue-600">คำแนะนำ:</strong> ขอแนะนำให้ท่านใช้อีเมล <span class="font-bold underline">@gmail.com</span> เป็นอีเมลหลัก เพื่อการรับแจ้งเตือนสถานะเอกสารที่รวดเร็วและเสถียรที่สุด
                    </p>
                </div>

                <div id="email-list" class="space-y-3">
                    <!-- Javascript จะสร้างช่องกรอกอีเมลมาใส่ที่นี่ -->
                </div>
            </div>

            <!-- ส่วนจัดการเบอร์โทรศัพท์แบบไดนามิก -->
            <div class="mb-8 pb-4 border-b border-slate-100">
                <div class="flex justify-between items-end mb-3">
                    <label class="block text-sm font-extrabold text-[var(--corp-blue)] uppercase tracking-wider ml-1">
                        <i class="ph-fill ph-phone mr-1"></i> เบอร์โทรศัพท์ (Phone)
                    </label>
                    <button type="button" onclick="addPhoneRow()" class="text-xs font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                        <i class="ph-bold ph-plus"></i> เพิ่มเบอร์โทร
                    </button>
                </div>

                <div id="phone-list" class="space-y-3">
                    <!-- Javascript จะสร้างช่องกรอกเบอร์โทรมาใส่ที่นี่ -->
                </div>
            </div>

            <!-- ปุ่มบันทึก -->
            <div class="flex justify-end gap-3">
                <a href="dashboard.html" class="px-6 py-3.5 rounded-xl font-bold text-slate-500 hover:bg-slate-100 transition-colors text-sm">ยกเลิก</a>
                <button type="submit" id="btn-submit" class="bg-[var(--corp-blue)] hover:bg-[var(--corp-blue-light)] text-white px-8 py-3.5 rounded-xl text-sm font-bold transition-all shadow-[0_4px_12px_rgba(0,28,84,0.15)] flex items-center gap-2 active:scale-95">
                    <i class="ph-bold ph-floppy-disk text-lg"></i> <span>บันทึกข้อมูล</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm hidden justify-center items-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="alert-box">
            <div class="w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center" id="alert-icon-bg">
                <i class="text-3xl" id="alert-icon"></i>
            </div>
            <h3 class="text-xl font-black text-slate-800 mb-2" id="alert-title">แจ้งเตือน</h3>
            <p class="text-sm text-slate-500 mb-6" id="alert-msg">รายละเอียด</p>
            <button onclick="closeAlert()" class="w-full py-3 rounded-xl text-sm font-bold text-white transition-colors" id="alert-btn">ตกลง</button>
        </div>
    </div>

    <script>
        // โครงสร้างข้อมูลอีเมล/เบอร์โทร
        let emailsData = [];
        let phonesData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (['blob:', 'about:', 'file:'].includes(window.location.protocol)) {
                document.getElementById('display-name').innerText = "Demo User (Preview)";
                document.getElementById('display-username').innerText = "@demo_user";
                document.getElementById('username').value = "demo_user";
                document.getElementById('full_name').value = "Demo User (Preview)";
                
                // ข้อมูลจำลองสำหรับโหมดพรีวิว
                initEmails([{ type: 'หลัก', customType: '', value: 'demo@example.com' }, { type: 'บริษัท', customType: '', value: 'demo@company.local' }]);
                initPhones([{ type: 'หลัก', customType: '', value: '081-234-5678' }]);
                return;
            }

            try {
                const response = await fetch('/api/user_profile');
                const result = await response.json();
                if (result.success) {
                    document.getElementById('display-name').innerText = result.full_name;
                    document.getElementById('display-username').innerText = "@" + result.username;
                    document.getElementById('username').value = result.username;
                    document.getElementById('full_name').value = result.full_name;

                    // แสดงรูปภาพโปรไฟล์ (ถ้ามี) มิฉะนั้นจะโชว์รูปคนเปล่าๆ
                    if (result.profile_pic) {
                        const img = document.getElementById('preview-img');
                        img.src = result.profile_pic;
                        img.style.display = 'block';
                        document.getElementById('fallback-icon').style.display = 'none';
                    }

                    // ดึงอีเมลหลัก (จาก column email) และอีเมลเสริม (จาก column additional_emails)
                    let eList = [];
                    if (result.email && result.email !== '-') eList.push({ type: 'หลัก', value: result.email });
                    if (result.additional_emails) {
                        try { eList = eList.concat(JSON.parse(result.additional_emails)); } catch(e){}
                    }
                    if (eList.length === 0) eList.push({ type: 'หลัก', value: '' });
                    initEmails(eList);

                    // ดึงเบอร์หลักและเสริม
                    let pList = [];
                    if (result.phone && result.phone !== '-') pList.push({ type: 'หลัก', value: result.phone });
                    if (result.additional_phones) {
                        try { pList = pList.concat(JSON.parse(result.additional_phones)); } catch(e){}
                    }
                    if (pList.length === 0) pList.push({ type: 'หลัก', value: '' });
                    initPhones(pList);
                }
            } catch (err) {
                console.error("Load profile error:", err);
            }
        });

        // ระบบสร้างและจัดการแถวอีเมล 
        function initEmails(dataArray) {
            const container = document.getElementById('email-list');
            container.innerHTML = '';
            dataArray.forEach((data, index) => addEmailRow(data, index === 0));
        }

        function addEmailRow(data = { type: 'รอง', customType: '', value: '' }, isFirst = false) {
            const container = document.getElementById('email-list');
            const rowId = 'email-' + Date.now() + Math.floor(Math.random() * 100);
            
            const div = document.createElement('div');
            div.className = 'flex flex-col sm:flex-row gap-2 items-start sm:items-center dynamic-row bg-white p-2 rounded-xl border border-slate-100 shadow-sm';
            div.id = rowId;
            
            const isPrimary = isFirst || data.type === 'หลัก';
            const typeOpts = `
                <option value="หลัก" ${data.type === 'หลัก' ? 'selected' : ''}>อีเมลหลัก</option>
                <option value="รอง" ${data.type === 'รอง' ? 'selected' : ''}>อีเมลรอง</option>
                <option value="บริษัท" ${data.type === 'บริษัท' ? 'selected' : ''}>อีเมลบริษัท</option>
                <option value="กำหนดเอง" ${data.type === 'กำหนดเอง' ? 'selected' : ''}>อื่นๆ (ระบุ)</option>
            `;

            div.innerHTML = `
                <div class="w-full sm:w-1/3 relative">
                    <select class="custom-select contact-type !py-2.5 !bg-slate-50" onchange="toggleCustomInput('${rowId}')" ${isPrimary ? 'disabled title="ช่องแรกต้องเป็นอีเมลหลักเสมอ"' : ''}>
                        ${typeOpts}
                    </select>
                    <input type="text" class="custom-input contact-custom mt-2 !py-2 !text-sm ${data.type === 'กำหนดเอง' ? 'block' : 'hidden'}" placeholder="ระบุประเภท..." value="${data.customType || ''}">
                </div>
                <div class="flex-1 w-full relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="ph-fill ph-envelope-simple text-lg"></i></div>
                    <input type="email" class="custom-input contact-value pl-10 !py-2.5" placeholder="example@gmail.com" value="${data.value}" required>
                </div>
                ${isPrimary ? `<div class="w-10 h-10 flex items-center justify-center shrink-0"><i class="ph-fill ph-star text-yellow-400 text-xl" title="Primary"></i></div>` : 
                `<button type="button" onclick="document.getElementById('${rowId}').remove()" class="w-10 h-10 shrink-0 bg-white border border-slate-200 text-slate-400 hover:text-red-500 hover:bg-red-50 hover:border-red-200 rounded-xl flex items-center justify-center transition-all shadow-sm active:scale-95"><i class="ph-bold ph-trash text-lg"></i></button>`}
            `;
            container.appendChild(div);
        }

        // ระบบสร้างและจัดการแถวเบอร์โทร 
        function initPhones(dataArray) {
            const container = document.getElementById('phone-list');
            container.innerHTML = '';
            dataArray.forEach((data, index) => addPhoneRow(data, index === 0));
        }

        function addPhoneRow(data = { type: 'รอง', customType: '', value: '' }, isFirst = false) {
            const container = document.getElementById('phone-list');
            const rowId = 'phone-' + Date.now() + Math.floor(Math.random() * 100);
            
            const div = document.createElement('div');
            div.className = 'flex flex-col sm:flex-row gap-2 items-start sm:items-center dynamic-row bg-white p-2 rounded-xl border border-slate-100 shadow-sm';
            div.id = rowId;
            
            const isPrimary = isFirst || data.type === 'หลัก';
            const typeOpts = `
                <option value="หลัก" ${data.type === 'หลัก' ? 'selected' : ''}>เบอร์หลัก</option>
                <option value="รอง" ${data.type === 'รอง' ? 'selected' : ''}>เบอร์รอง</option>
                <option value="ที่ทำงาน" ${data.type === 'ที่ทำงาน' ? 'selected' : ''}>ที่ทำงาน</option>
                <option value="กำหนดเอง" ${data.type === 'กำหนดเอง' ? 'selected' : ''}>อื่นๆ (ระบุ)</option>
            `;

            div.innerHTML = `
                <div class="w-full sm:w-1/3 relative">
                    <select class="custom-select contact-type !py-2.5 !bg-slate-50" onchange="toggleCustomInput('${rowId}')" ${isPrimary ? 'disabled title="ช่องแรกต้องเป็นเบอร์หลักเสมอ"' : ''}>
                        ${typeOpts}
                    </select>
                    <input type="text" class="custom-input contact-custom mt-2 !py-2 !text-sm ${data.type === 'กำหนดเอง' ? 'block' : 'hidden'}" placeholder="ระบุประเภท..." value="${data.customType || ''}">
                </div>
                <div class="flex-1 w-full relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="ph-fill ph-phone text-lg"></i></div>
                    <input type="tel" class="custom-input contact-value pl-10 !py-2.5" placeholder="08X-XXX-XXXX" value="${data.value}" required>
                </div>
                ${isPrimary ? `<div class="w-10 h-10 flex items-center justify-center shrink-0"><i class="ph-fill ph-star text-yellow-400 text-xl" title="Primary"></i></div>` : 
                `<button type="button" onclick="document.getElementById('${rowId}').remove()" class="w-10 h-10 shrink-0 bg-white border border-slate-200 text-slate-400 hover:text-red-500 hover:bg-red-50 hover:border-red-200 rounded-xl flex items-center justify-center transition-all shadow-sm active:scale-95"><i class="ph-bold ph-trash text-lg"></i></button>`}
            `;
            container.appendChild(div);
        }

        function toggleCustomInput(rowId) {
            const row = document.getElementById(rowId);
            const select = row.querySelector('.contact-type');
            const customInput = row.querySelector('.contact-custom');
            if (select.value === 'กำหนดเอง') {
                customInput.classList.remove('hidden');
                customInput.classList.add('block');
                customInput.required = true;
            } else {
                customInput.classList.add('hidden');
                customInput.classList.remove('block');
                customInput.required = false;
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('fallback-icon').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        // รวบรวมข้อมูลก่อนบันทึก
        async function saveProfile(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div> <span>กำลังบันทึก...</span>';
            btn.disabled = true;

            const form = document.getElementById('profile-form');
            const formData = new FormData(form);

            // เก็บอีเมลทั้งหมด
            let primaryEmail = '';
            const additionalEmails = [];
            document.getElementById('email-list').querySelectorAll('.dynamic-row').forEach((row, idx) => {
                const type = row.querySelector('.contact-type').value || (idx===0 ? 'หลัก' : 'รอง');
                const customType = row.querySelector('.contact-custom').value;
                const value = row.querySelector('.contact-value').value;
                if(value) {
                    if(idx === 0 || type === 'หลัก') primaryEmail = value;
                    else additionalEmails.push({ type, customType, value });
                }
            });

            // เก็บเบอร์โทรทั้งหมด
            let primaryPhone = '';
            const additionalPhones = [];
            document.getElementById('phone-list').querySelectorAll('.dynamic-row').forEach((row, idx) => {
                const type = row.querySelector('.contact-type').value || (idx===0 ? 'หลัก' : 'รอง');
                const customType = row.querySelector('.contact-custom').value;
                const value = row.querySelector('.contact-value').value;
                if(value) {
                    if(idx === 0 || type === 'หลัก') primaryPhone = value;
                    else additionalPhones.push({ type, customType, value });
                }
            });

            // ส่งค่าไปแทนที่
            formData.set('email', primaryEmail);
            formData.set('additional_emails', JSON.stringify(additionalEmails));
            formData.set('phone', primaryPhone);
            formData.set('additional_phones', JSON.stringify(additionalPhones));

            if (['blob:', 'about:', 'file:'].includes(window.location.protocol)) {
                setTimeout(() => {
                    showAlert('success', 'บันทึกสำเร็จ!', 'ข้อมูลโปรไฟล์ได้รับการอัปเดตเรียบร้อยแล้ว (โหมดพรีวิว)', () => window.location.href='dashboard.html');
                    btn.innerHTML = originalText;
                }, 1000);
                return;
            }

            try {
                const response = await fetch('/api/update_profile', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    showAlert('success', 'บันทึกสำเร็จ!', 'ข้อมูลโปรไฟล์ได้รับการอัปเดตเรียบร้อยแล้ว', () => {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    showAlert('error', 'เกิดข้อผิดพลาด', result.message || 'ไม่สามารถบันทึกข้อมูลได้');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showAlert('error', 'ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showAlert(type, title, msg, callback = null) {
            const modal = document.getElementById('alert-modal');
            const box = document.getElementById('alert-box');
            const iconBg = document.getElementById('alert-icon-bg');
            const icon = document.getElementById('alert-icon');
            const btn = document.getElementById('alert-btn');

            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;

            if (type === 'success') {
                iconBg.className = 'w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center bg-green-100 text-green-500';
                icon.className = 'ph-fill ph-check-circle text-4xl';
                btn.className = 'w-full py-3 rounded-xl text-sm font-bold text-white transition-colors bg-green-500 hover:bg-green-600';
            } else {
                iconBg.className = 'w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center bg-red-100 text-red-500';
                icon.className = 'ph-fill ph-warning-circle text-4xl';
                btn.className = 'w-full py-3 rounded-xl text-sm font-bold text-white transition-colors bg-red-500 hover:bg-red-600';
            }

            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
            }, 10);

            btn.onclick = () => {
                closeAlert();
                if (callback) callback();
            };
        }

        function closeAlert() {
            const modal = document.getElementById('alert-modal');
            const box = document.getElementById('alert-box');
            modal.classList.add('opacity-0');
            box.classList.add('scale-95');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
    </script>
</body>
</html>
